<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CU Student ID Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f6f8; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 5px solid #005a9c; }
        .logo { width: 70px; height: auto; margin-bottom: 15px; }
        h2 { color: #005a9c; margin-bottom: 5px; font-size: 20px; }
        h3 { color: #555; margin-top: 0; font-size: 14px; font-weight: normal; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e1e4e8; font-size: 14px; }
        th { color: #666; font-weight: 600; width: 40%; }
        td { color: #111; font-weight: bold; }
        .status-badge { display: inline-block; padding: 5px 12px; background-color: #28a745; color: white; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://wikimedia.org" class="logo" alt="CU Logo">
    <h2>University of Chittagong</h2>
    <h3>ICT Cell - Student ID Verification Portal</h3>
    
    <table>
        <tr>
            <th>Student Name:</th>
            <td>Sabbir Ahamed</td>
        </tr>
        <tr>
            <th>Student ID:</th>
            <td>23201007</td>
        </tr>
        <tr>
            <th>Session:</th>
            <td>2022-2023</td>
        </tr>
        <tr>
            <th>Subject:</th>
            <td>Physics</td>
        </tr>
        <tr>
            <th>Blood Group:</th>
            <td>B+</td>
        </tr>
        <tr>
            <th>Verification Status:</th>
            <td><span class="status-badge">✓ Active Student</span></td>
        </tr>
    </table>
</div>

</body>
</html>
