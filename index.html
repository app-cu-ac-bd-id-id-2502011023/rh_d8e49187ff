<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Allows scrollbars to appear naturally when zooming in */
            overflow: auto; 
        }

        img {
            /* Displays at full width on mobile, constrained to screen on desktop */
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <img src="cu_digital_id_card_verify.png" alt="Display Image">

</body>
</html>
