<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Required so mobile browsers scale the image properly to the screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Change to #000000 for black background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Hides scrollbars */
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Preserves aspect ratio without stretching */
            display: block;
        }
    </style>
</head>
<body>

    <!-- IMPORTANT: Must match your image's exact name and extension -->
    <img src="WhatsApp Image 2026-11-03 at 9.58.26 PM.png" alt="Display Image">

</body>
</html>
